<!DOCTYPE html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Oxford 3000 사진 카드</title>
<style>
:root{--bg:#f4f7f7;--sf:#fff;--tx:#14201f;--mut:#667574;--ac:#0f766e;--bd:#d6e0df;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#0e1514;--sf:#172120;--tx:#eaf2f1;--mut:#8da09e;--ac:#4fd1c0;--bd:#2a3836}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
main{max-width:480px;margin:0 auto;padding:12px 16px 32px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:14px}
.bar{height:4px;background:var(--bd);border-radius:2px;margin:8px 0 14px}
.bar i{display:block;height:100%;width:0;background:var(--ac);border-radius:2px}
button,input,textarea{font:inherit;color:var(--tx)}
button{padding:12px 10px;border-radius:12px;border:1px solid var(--bd);background:var(--sf);cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}
#gear{padding:6px 10px}
#card{background:var(--sf);border-radius:20px;padding:12px 12px 16px;text-align:center;cursor:pointer;user-select:none}
.ph{position:relative;aspect-ratio:1/1;border-radius:14px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.cr{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:8px;text-decoration:none}
.w{font-size:32px;font-weight:700;margin-top:12px}
.ko{font-size:22px;font-weight:600;color:var(--ac)}
.ex{color:var(--mut);margin-top:4px}
.hint{color:var(--mut);font-size:14px;margin-top:14px}
.row{display:flex;gap:8px;margin-top:10px}
.row>*{flex:1}
input[type=text],input[type=password],textarea{width:100%;border:1px solid var(--bd);border-radius:12px;background:var(--sf);padding:10px}
textarea{min-height:92px;margin-top:6px;resize:vertical}
label{display:block;margin-top:16px;font-size:14px;color:var(--mut)}
#msg{min-height:22px;margin-top:8px;font-size:14px;color:var(--mut);text-align:center}
#setup{background:var(--sf);border-radius:16px;padding:16px;margin-bottom:14px;font-size:15px}
#setup ol{padding-left:20px;margin:8px 0}
#setup a{color:var(--ac)}
[hidden]{display:none!important}
</style></head><body><main>
<div class="top"><span id="cnt"></span><button id="gear" aria-label="설정">설정</button></div>
<div class="bar"><i id="pg"></i></div>

<section id="setup" hidden>
<strong>Unsplash 키를 한 번만 입력하세요</strong>
<ol>
<li><a href="https://unsplash.com/developers" target="_blank" rel="noopener">unsplash.com/developers</a>에서 가입하고 New Application을 만들어요.</li>
<li>Access Key를 복사해서 아래에 붙여넣어요.</li>
</ol>
<input type="password" id="key" placeholder="Access Key" autocomplete="off">
<div class="row"><button class="p" id="savekey">저장하고 시작</button></div>
</section>

<div id="card"></div>
<div class="row"><button id="other">다른 사진</button><button id="paste">붙여넣기</button><button id="mine">내 사진</button></div>
<input type="file" id="file" accept="image/*" hidden>
<div class="row"><input type="text" id="q" aria-label="검색어" placeholder="영어 검색어"><button id="go" style="flex:0 0 auto">검색</button></div>
<div id="msg" role="status"></div>
<label for="note">내 경험, 내 문장</label>
<textarea id="note" placeholder="이 단어와 연결되는 기억을 적어 보세요"></textarea>
<div class="row" style="margin-top:14px"><button id="prev">이전</button><button class="p" id="next">다음</button></div>
</main>
<script>
const D=`abandon|버리다, 포기하다|abandoned house|They abandoned the old house.
ability|능력|weightlifter strong|She has the ability to learn fast.
able|~할 수 있는|child swimming pool|I’m able to swim.
about|약, ~에 대해|wall clock five o’clock|It’s about 5 pm.
above|~위에|bird flying above tree|The bird is above the tree.
absolute|절대적인|perfect gold circle|I have absolute trust in you.
absolutely|전적으로|friends high five|I absolutely agree.
academic|학업의|university library student|Her academic results are great.
accept|받아들이다|receiving gift|I accept your offer.
acceptable|용인되는|okay hand sign|This quality is acceptable.
access|접근(권)|key card door|I have access to the files.
accident|사고|car crash|He had an accident.
accommodation|숙소|hotel room|We booked the accommodation.
according to|~에 따르면|reading newspaper|According to the news, it will rain.
account|계좌, 설명|bank card|I opened a bank account.
accurate|정확한|dartboard bullseye|The map is accurate.
achieve|달성하다|mountain summit climber|She achieved her goal.
achievement|성취|golden trophy|It’s a great achievement.
acid|산|lemon|Lemon juice contains acid.
across|가로질러|bridge crossing|We walked across the bridge.
act|행동하다|theater stage|Act quickly.
action|행동|sprinter running|Take action now.
active|활동적인|hiking trail|He is very active.
activity|활동|playing soccer|Sports are my favorite activity.
actor|배우|actor on stage|The actor won an award.
actual|실제의|magnifying glass|What was the actual cost?
actually|사실은|thinking man|Actually, I disagree.
adapt|적응하다|chameleon|I adapted to the new job.
add|더하다|adding salt cooking|Add some salt.
addition|추가|plus sign blocks|In addition, we need more time.
additional|추가적인|extra chair|There is an additional fee.
address|주소, 다루다|house number mailbox|What’s your address?
adjust|조정하다|volume knob|Adjust the volume.
admire|존경하다|looking up admiration|I admire her courage.
admit|인정하다|raising hand|He admitted his mistake.
adult|성인|adult man walking|Adults pay more.
advanced|고급의|advanced technology|an advanced course
advantage|이점|chess pieces|Speed is our advantage.
adventure|모험|canyon hiking adventure|It was a big adventure.
advertise|광고하다|billboard|They advertise on TV.
advertisement|광고|advertising billboard city|I saw an advertisement.
advertising|광고업|marketing team meeting|She works in advertising.
advice|조언|mentor talking|Thanks for the advice.
advise|조언하다|consultant advising client|I advise you to wait.
affect|영향을 미치다|water ripple|Weather affects my mood.
afford|~할 여유가 있다|coins wallet|I can’t afford a car.
afraid|두려워하는|scared person|I’m afraid of dogs.
after|~후에|sunset sky|Call me after lunch.
afternoon|오후|afternoon cafe sunlight|See you this afternoon.
afterwards|나중에|evening clock|We ate and went home afterwards.
figure out|알아내다 (구동사)|solving puzzle|I can’t figure out this problem.
come up with|생각해내다 (구동사)|light bulb idea|She came up with a great idea.
give up|포기하다 (구동사)|tired runner sitting|Don’t give up.
look forward to|~을 기대하다 (구동사)|excited child holiday|I’m looking forward to the trip.
find out|알게 되다 (구동사)|detective magnifying glass|I found out the truth.
I’m not sure if...|~인지 잘 모르겠어 (청크)|shrugging person|I’m not sure if he’s coming.
It turns out...|알고 보니 ~더라 (청크)|surprised face|It turns out she was right.
To be honest, ...|솔직히 말하면 (청크)|friends honest talk|To be honest, I was nervous.
That makes sense.|말 되네, 이해돼 (청크)|nodding understanding|Oh, that makes sense.
I’ll get back to you.|나중에 다시 연락할게 (청크)|phone call office|I’ll get back to you tomorrow.`.split("\n").map(l=>{const a=l.split("|");return{w:a[0],k:a[1],q:a[2],x:a[3]}});

const $=id=>document.getElementById(id);
let S={key:"",sel:{},notes:{},q:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem("fc1")||"{}"))}catch(e){}
let i=0,flip=false,R={},busy=false,T;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const msg=t=>{$("msg").textContent=t||""};
const store=()=>{try{localStorage.setItem("fc1",JSON.stringify(S))}catch(e){msg("저장 공간이 부족해요. 일부 사진을 지우거나 줄여 주세요.")}};

async function api(path,full){
  const r=await fetch(full||("https://api.unsplash.com"+path),{headers:{Authorization:"Client-ID "+S.key}});
  if(!r.ok)throw new Error(r.status);
  return r.json();
}

async function load(next){
  if(!S.key){$("setup").hidden=false;return}
  if(busy)return;
  busy=true;msg("사진을 찾는 중입니다");
  try{
    const r=R[i]||(R[i]={res:[],idx:-1,page:0});
    if(next||!S.sel[i]){
      if(r.idx+1>=r.res.length){
        r.page++;
        const j=await api("/search/photos?query="+encodeURIComponent(S.q[i]||D[i].q)+"&per_page=10&page="+r.page+"&orientation=squarish&content_filter=high");
        r.res=r.res.concat(j.results);
      }
      if(r.idx+1>=r.res.length){msg("더 이상 사진이 없어요. 검색어를 바꿔 보세요.");busy=false;draw();return}
      const p=r.res[++r.idx];
      S.sel[i]={u:p.urls.small,n:p.user.name,l:p.links.html};
      api("",p.links.download_location).catch(()=>{});
      store();
    }
    msg("");
  }catch(e){
    const c=e.message;
    msg(c==="401"?"키가 올바르지 않아요. 설정에서 다시 입력해 주세요.":(c==="403"||c==="429")?"요청 한도를 넘었어요. 1시간 뒤에 다시 시도해 주세요.":"사진을 불러오지 못했어요. 인터넷 연결을 확인해 주세요.");
  }
  busy=false;draw();
}

function draw(){
  const c=D[i],s=S.sel[i];
  $("cnt").textContent=(i+1)+" / "+D.length;
  $("pg").style.width=((i+1)/D.length*100)+"%";
  $("q").value=S.q[i]||c.q;
  $("note").value=S.notes[i]||"";
  const img=s?`<img src="${s.c||esc(s.u)}" alt="${esc(c.q)}">`:`<span>${S.key?"사진을 불러오는 중":"설정에서 Unsplash 키를 입력하세요"}</span>`;
  const cr=s&&!s.c?`<a class="cr" href="${esc(s.l)}?utm_source=oxford3000_cards&utm_medium=referral" target="_blank" rel="noopener">Photo by ${esc(s.n)} / Unsplash</a>`:"";
  $("card").innerHTML=`<div class="ph">${img}${cr}</div>`+(flip
    ?`<div class="w">${esc(c.w)}</div><div class="ko">${esc(c.k)}</div><div class="ex">${esc(c.x)}</div>`
    :`<div class="hint">사진을 보고 단어를 떠올린 뒤 탭하세요</div>`);
}

function go(n){
  if(n<0||n>=D.length)return;
  i=n;flip=false;draw();
  if(!S.sel[i]&&S.key)load();
}

function addImg(f){
  const rd=new FileReader();
  rd.onload=()=>{
    const im=new Image();
    im.onload=()=>{
      const k=Math.min(1,480/Math.max(im.width,im.height)),c=document.createElement("canvas");
      c.width=im.width*k;c.height=im.height*k;
      c.getContext("2d").drawImage(im,0,0,c.width,c.height);
      S.sel[i]={c:c.toDataURL("image/jpeg",.8)};
      store();draw();msg("내 사진을 넣었어요");
    };
    im.src=rd.result;
  };
  rd.readAsDataURL(f);
}

$("card").onclick=e=>{if(e.target.closest("a"))return;flip=!flip;draw()};
$("next").onclick=()=>go(i+1);
$("prev").onclick=()=>go(i-1);
$("other").onclick=()=>load(true);
$("go").onclick=()=>{S.q[i]=$("q").value.trim()||D[i].q;delete R[i];store();load(true)};
$("q").onkeydown=e=>{if(e.key==="Enter")$("go").click()};
$("mine").onclick=()=>$("file").click();
$("file").onchange=e=>{const f=e.target.files[0];if(f)addImg(f);e.target.value=""};
$("paste").onclick=async()=>{
  try{
    for(const it of await navigator.clipboard.read()){
      const t=it.types.find(x=>x.startsWith("image/"));
      if(t){addImg(await it.getType(t));return}
    }
    msg("복사된 이미지가 없어요. 사진을 길게 눌러 이미지 복사를 먼저 해 주세요.");
  }catch(e){msg("붙여넣기가 막혀 있어요. 내 사진 버튼으로 갤러리에서 골라 주세요.")}
};
document.addEventListener("paste",e=>{
  const it=[...(e.clipboardData?.items||[])].find(t=>t.type.startsWith("image/"));
  if(it){e.preventDefault();addImg(it.getAsFile())}
});
$("note").oninput=()=>{S.notes[i]=$("note").value;clearTimeout(T);T=setTimeout(store,400)};
$("gear").onclick=()=>{$("setup").hidden=!$("setup").hidden;$("key").value=S.key};
$("savekey").onclick=()=>{
  const k=$("key").value.trim();
  if(!k){msg("키를 입력해 주세요.");return}
  S.key=k;store();$("setup").hidden=true;msg("");
  if(!S.sel[i])load();
};
document.addEventListener("keydown",e=>{
  if(/INPUT|TEXTAREA/.test(document.activeElement.tagName))return;
  if(e.key==="ArrowRight")go(i+1);
  if(e.key==="ArrowLeft")go(i-1);
});

if(!S.key)$("setup").hidden=false;
draw();
if(S.key&&!S.sel[i])load();
</script></body></html>
