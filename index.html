<style>

@media (prefers-color-scheme:dark){:root{--bg:#0c1312;--sf:#16201f;--tx:#e9f3f1;--mut:#8fa5a1;--ac:#2dd4bf;--ac2:#0f766e;--bd:#27373a;--bad:#fb923c;--r0:#4a2620;--r1:#473a1a;--r2:#17413a;--r3:#1b3150;--sh:none}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:17px/1.55 -apple-system,"Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;padding:env(safe-area-inset-top) 0 0}
main{max-width:480px;margin:0 auto;padding:14px 16px 130px}
button,input,textarea{font:inherit;color:var(--tx)}
button{padding:12px 12px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);cursor:pointer}
button:disabled{opacity:.4}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid var(--ac);outline-offset:2px}
button.p{background:var(--ac);border-color:var(--ac);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){button.p{color:#06201c}}
button.big{width:100%;padding:16px;font-size:18px;border-radius:16px}
button.lk{border:0;background:none;color:var(--ac);padding:6px 0;font-weight:600}
button.ic{border:0;background:none;padding:0 6px;font-size:22px}
.top{display:flex;justify-content:space-between;align-items:center;color:var(--mut);font-size:15px;margin-bottom:6px}
.pbar{height:8px;background:var(--bd);border-radius:6px;margin-bottom:14px;overflow:hidden}.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--ac2),var(--ac));border-radius:6px;transition:width .3s}
.hero{display:flex;gap:16px;align-items:center;background:linear-gradient(135deg,var(--ac2),var(--ac));color:#fff;border-radius:24px;padding:20px;margin-bottom:14px;box-shadow:var(--sh)}
.hero .mut{color:rgba(255,255,255,.85)}
.ring{flex:0 0 auto;width:88px;height:88px;border-radius:50%;background:conic-gradient(#fff calc(var(--p)*1%),rgba(255,255,255,.3) 0);display:grid;place-items:center}
.ring span{width:68px;height:68px;border-radius:50%;background:var(--ac);display:grid;place-items:center;font-weight:800;font-size:19px}
.big2{font-size:21px;font-weight:800}.streak{margin-top:4px;font-weight:700}
.tcard{display:flex;align-items:center;gap:12px;background:var(--sf);border-radius:20px;padding:14px;margin-top:10px;box-shadow:var(--sh)}
.tcard .ico{font-size:30px}.tcard>div:nth-child(2){flex:1;min-width:0}
.tcard button{flex:0 0 auto;min-width:76px}
.mini{height:6px;background:var(--bd);border-radius:4px;margin-top:6px;overflow:hidden}.mini i{display:block;height:100%;background:var(--ac)}
.card{position:relative;background:var(--sf);border-radius:26px;padding:14px 14px 20px;text-align:center;cursor:pointer;user-select:none;margin-bottom:12px;box-shadow:var(--sh)}
.phw{position:relative}
.ph{position:relative;aspect-ratio:1/1;border-radius:18px;overflow:hidden;background:var(--bd);display:flex;align-items:center;justify-content:center;color:var(--mut)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.q{font-size:72px;font-weight:800;color:var(--mut);padding:12px}.q small{display:block;font-size:15px;font-weight:500}.q.err{font-size:15px;font-weight:600;color:var(--bad)}
.tools{position:absolute;top:8px;right:8px;display:flex;gap:6px}.tools button{padding:6px 10px;background:rgba(0,0,0,.45);color:#fff;border:0;border-radius:12px;font-size:18px}
.cr{position:absolute;left:8px;bottom:8px;font-size:11px;color:#fff;background:rgba(0,0,0,.55);padding:2px 8px;border-radius:8px;text-decoration:none}
.lv{display:inline-block;font-size:12px;font-weight:700;background:var(--r2);color:var(--ac);border-radius:10px;padding:2px 10px;margin-bottom:6px}
.lv.abs{position:absolute;top:22px;left:22px;z-index:1;background:var(--ac);color:#fff}
.w{font-size:36px;font-weight:800;margin-top:14px;line-height:1.2}.w2{font-size:21px;font-weight:700;margin:8px 0}
.ipa{color:var(--mut);font-size:18px}.pos{color:var(--mut);font-size:14px}
.ko{font-size:24px;font-weight:700;color:var(--ac);margin-top:4px}
.def{color:var(--mut);margin-top:8px;font-size:16px;text-align:left}.ex{margin-top:8px;font-style:italic}
.sit{font-size:22px;font-weight:700;margin:6px 0;line-height:1.4}
.hint{color:var(--mut);font-size:15px;margin-top:12px}
.bad{color:var(--bad);font-size:15px;margin-top:10px}
.fb{border-radius:18px;padding:14px;margin-bottom:12px;text-align:left;font-size:16px}
.fb.ok{background:var(--r2)}.fb.near{background:var(--r1)}.fb.bad2,.fb.warn{background:var(--r0)}.fb.n{background:var(--sf)}
.fb s{color:var(--bad)}.fb b.mi{color:var(--ac);text-decoration:underline}
.fb small{display:block;color:var(--mut);margin-top:6px}
textarea,input[type=text],input[type=password],input[type=number]{width:100%;border:2px solid var(--bd);border-radius:16px;background:var(--sf);padding:12px;font-size:17px}
textarea{min-height:96px;resize:vertical;margin-bottom:10px}
label{display:block;font-size:15px;color:var(--mut);margin:14px 0 6px}
.row{display:flex;gap:8px;margin-bottom:10px}.row>*{flex:1}
.bar2{position:fixed;left:0;right:0;bottom:0;padding:18px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(rgba(0,0,0,0),var(--bg) 35%)}
.bar2 .in{max-width:480px;margin:0 auto}
.rate{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rate button{display:flex;flex-direction:column;padding:12px 2px;border:2px solid transparent;font-size:16px}
.rate small{color:var(--mut);font-size:12px;font-weight:500}
.rate .r0{background:var(--r0)}.rate .r1{background:var(--r1)}.rate .r2{background:var(--r2)}.rate .r3{background:var(--r3)}
.rate .sug{border-color:var(--ac);box-shadow:0 0 0 3px var(--r2)}
.mut{color:var(--mut);font-size:15px}.sec{margin:18px 0 8px;font-weight:800}
.note{background:var(--sf);border-radius:16px;padding:12px 14px;font-size:15px;color:var(--mut);margin-bottom:10px}
.done{text-align:center;padding:40px 10px}.done .em{font-size:64px}
#msg{min-height:22px;margin-top:6px;font-size:15px;color:var(--mut);text-align:center}

@keyframes in{from{opacity:0;transform:translateY(8px) scale(.98)}to{opacity:1;transform:none}}
.card{animation:in .25s ease}
.lvl{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 6px}
.week{display:flex;gap:6px}.week>div{flex:1;text-align:center}.week small{color:var(--mut);font-size:12px;display:block}.week span{display:grid;place-items:center;height:34px;border-radius:50%;background:var(--bd);font-weight:800;color:#fff}.week .on span{background:var(--ac)}
.bdg{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0}.bdg span{flex:0 0 calc(25% - 6px);text-align:center;padding:8px 2px;border-radius:14px;background:var(--sf);font-size:24px;opacity:.35;filter:grayscale(1)}.bdg span.on{opacity:1;filter:none}.bdg small{display:block;font-size:11px;color:var(--mut)}
.wide2{width:100%;margin:8px 0;padding:12px;border-radius:14px}
.popx{position:fixed;left:50%;top:22%;transform:translateX(-50%);background:var(--ac);color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.4);font-weight:800;padding:8px 16px;border-radius:20px;z-index:9;animation:pop 1s ease forwards;pointer-events:none;white-space:nowrap}
@keyframes pop{0%{opacity:0;transform:translate(-50%,10px)}20%{opacity:1}100%{opacity:0;transform:translate(-50%,-40px)}}
.cf{position:fixed;top:-30px;font-size:26px;z-index:8;animation:fall 2.4s linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(110vh) rotate(360deg)}}
.th{display:flex;gap:10px;margin:6px 0}.th button{width:42px;height:42px;border-radius:50%;border:3px solid var(--bg);padding:0}
@media (prefers-reduced-motion:reduce){.card,.popx,.cf{animation:none}}

.bub.me{margin:8px 0 8px 36px;border-radius:18px 18px 4px 18px;background:var(--r2)}

.cap{position:absolute;left:0;right:0;bottom:0;padding:34px 14px 12px;background:linear-gradient(rgba(0,0,0,0),rgba(0,0,0,.72));color:#fff;font-size:26px;font-weight:800;text-align:center;border-radius:0 0 18px 18px}
.cap small{display:block;font-size:12px;font-weight:500;opacity:.85}
.cr{top:8px;bottom:auto}

.etl{background:var(--sf);border-radius:14px;padding:10px 14px;margin-bottom:8px}

.btn{display:inline-block;padding:12px 14px;border-radius:14px;border:1px solid var(--bd);background:var(--sf);color:var(--tx);text-decoration:none;text-align:center;font-weight:700;flex:0 0 auto;min-width:72px}

function lcs(a,b){const n=a.length,m=b.length,D=Array.from({length:n+1},()=>Array(m+1).fill(0));
 for(let i=n-1;i>=0;i--)for(let j=m-1;j>=0;j--)D[i][j]=a[i]===b[j]?D[i+1][j+1]+1:Math.max(D[i+1][j],D[i][j+1]);
 const ia=new Set,ib=new Set;let i=0,j=0;
 while(i<n&&j<m){if(a[i]===b[j]){ia.add(i);ib.add(j);i++;j++}else if(D[i+1][j]>=D[i][j+1])i++;else j++}
 return{len:D[0][0],ia,ib}}

 const u=norm(ans);if(!u.length)return null;

 if(!ms.length)return{lv:"n",t:"내 답과 정답을 직접 비교해 보세요",b:""};
 let best=null;
 for(const m of ms){const t=norm(m),r=lcs(u,t),sc=r.len/Math.max(u.length,t.length);if(!best||sc>best.sc)best={m,t,r,sc}}
 const same=(a,b)=>a.length===b.length&&a.every((w,i)=>w===b[i]);
 const wrong=(it.x||"").split(" / ").map(x=>norm(x.split(" (")[0])).some(w=>w.length&&same(u,w));
 const mine=u.map((w,i)=>best.r.ia.has(i)?esc(w):`<s>${esc(w)}</s>`).join(" "),right=best.t.map((w,i)=>best.r.ib.has(i)?esc(w):`<b class="mi">${esc(w)}</b>`).join(" ");
